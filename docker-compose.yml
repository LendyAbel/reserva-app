services:
  postgres:
    image: postgres:18-alpine
    container_name: reserva-app-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: reserva
      POSTGRES_PASSWORD: reserva
      POSTGRES_DB: reserva_app
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reserva -d reserva_app"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:9-alpine
    container_name: reserva-app-queue
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - valkey_data:/data

volumes:
  postgres_data:
  valkey_data: